# This workflow runs automated application checks so we catch issues before merging.

name: CI

on:
  push:               # run on pushes to ANY branch
  pull_request:       # run on PRs

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip" # speeds up installs between workflow runs
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Install runtime dependencies only if the file is not empty.
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install frontend lint dependencies
        run: npm ci

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format (check)
        run: python -m ruff format --check .

      - name: Lint frontend JavaScript
        run: npm run lint:frontend

      - name: Pytest
        run: python -m pytest

      - name: Bandit
        run: python -m bandit -q -r app

      - name: pip-audit (runtime only)
        run: |
          # Audit only deployed/runtime dependencies.
          if [ -s requirements.txt ]; then
            python -m pip_audit -r requirements.txt
          else
            echo "requirements.txt is empty; skipping runtime dependency audit"
          fi

  build:
    name: Build lambda.zip (linux)
    runs-on: ubuntu-latest
    needs: [quality] # only build if all quality checks pass

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build lambda.zip
        run: |
          chmod +x scripts/build_lambda.sh
          ./scripts/build_lambda.sh

      - name: Upload lambda.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: lambda.zip