# Deploys the application to the dev environment when code is merged to main.
# Also supports manual runs from the Actions tab for safer first-time testing.

name: CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Needed for:
# - reading the repository contents
# - requesting an OIDC token so GitHub Actions can assume the AWS IAM role
permissions:
  contents: read
  id-token: write

# Prevent two dev deployments running at the same time.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build lambda.zip
        run: |
          chmod +x scripts/build_lambda.sh
          ./scripts/build_lambda.sh

      - name: Check lambda.zip exists
        run: test -f lambda.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-west-2

      - name: Verify AWS caller identity
        run: aws sts get-caller-identity

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: infra/terraform
        env:
          TF_VAR_workflow_secret: ${{ secrets.WORKFLOW_SECRET }}
        run: terraform plan -input=false -var-file="env/dev.tfvars"

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          TF_VAR_workflow_secret: ${{ secrets.WORKFLOW_SECRET }}
        run: terraform apply -input=false -auto-approve -var-file="env/dev.tfvars"

      - name: Show outputs
        working-directory: infra/terraform
        run: terraform output