# Manually promotes a known-good tagged version to production.
# The selected tag should point to a commit already proven in dev.

name: Promote to Prod

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag to promote to prod (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

# Prevent two production deployments from running at the same time.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy tagged release to prod
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build lambda.zip
        run: |
          chmod +x scripts/build_lambda.sh
          ./scripts/build_lambda.sh

      - name: Check lambda.zip exists
        run: test -f lambda.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Verify AWS caller identity
        run: aws sts get-caller-identity

      # Important:
      # - This uses the separate prod backend state.
      # - That keeps production state isolated from dev.
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -input=false -backend-config="env/prod-backend.hcl"

      - name: Terraform plan
        working-directory: infra/terraform
        env:
          TF_VAR_workflow_secret: ${{ secrets.WORKFLOW_SECRET }}
        run: terraform plan -input=false -var-file="env/prod.tfvars"

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          TF_VAR_workflow_secret: ${{ secrets.WORKFLOW_SECRET }}
        run: terraform apply -input=false -auto-approve -var-file="env/prod.tfvars"

      - name: Show outputs
        working-directory: infra/terraform
        run: terraform output