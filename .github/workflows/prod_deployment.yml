# Manually promotes the current main commit to production.
# The workflow creates the Git tag in GitHub, then deploys prod from that exact tag.

name: Promote to Prod

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create and promote to prod (example: v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

# Prevent two production deployments from running at the same time.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Tag and deploy release to prod
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release tag format
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/${{ inputs.release_tag }}" >/dev/null 2>&1; then
            echo "Tag '${{ inputs.release_tag }}' already exists."
            exit 1
          fi

      - name: Create and push release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${{ inputs.release_tag }}" -m "Production release ${{ inputs.release_tag }}"
          git push origin "${{ inputs.release_tag }}"

      - name: Checkout selected tag
        run: |
          git checkout "refs/tags/${{ inputs.release_tag }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build lambda.zip
        run: |
          chmod +x scripts/build_lambda.sh
          ./scripts/build_lambda.sh

      - name: Check lambda.zip exists
        run: test -f lambda.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Verify AWS caller identity
        run: aws sts get-caller-identity

      # Important:
      # - This uses the separate prod backend state.
      # - That keeps production state isolated from dev.
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -input=false -backend-config="env/prod-backend.hcl"

      - name: Terraform plan
        working-directory: infra/terraform
        env:
          TF_VAR_workflow_secret: ${{ secrets.WORKFLOW_SECRET }}
        run: terraform plan -input=false -var-file="env/prod.tfvars"

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          TF_VAR_workflow_secret: ${{ secrets.WORKFLOW_SECRET }}
        run: terraform apply -input=false -auto-approve -var-file="env/prod.tfvars"

      - name: Show outputs
        working-directory: infra/terraform
        run: terraform output

      - name: Capture API endpoint
        working-directory: infra/terraform
        run: echo "HTTP_API_ENDPOINT=$(terraform output -raw http_api_endpoint)" >> $GITHUB_ENV

      - name: Capture frontend bucket name
        working-directory: infra/terraform
        run: echo "FRONTEND_BUCKET=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_ENV

      - name: Capture CloudFront distribution id
        working-directory: infra/terraform
        run: echo "FRONTEND_CF_DISTRIBUTION_ID=$(terraform output -raw frontend_cloudfront_distribution_id)" >> $GITHUB_ENV

      - name: Inject frontend API base URL
        env:
          FRONTEND_API_BASE_URL: ${{ env.HTTP_API_ENDPOINT }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("frontend/app.js")
          content = path.read_text(encoding="utf-8")

          placeholder = "__API_BASE_URL__"
          value = os.environ["FRONTEND_API_BASE_URL"].strip().rstrip("/")

          if placeholder not in content:
              raise SystemExit("Missing __API_BASE_URL__ placeholder in frontend/app.js")

          if not value:
              raise SystemExit("HTTP_API_ENDPOINT is empty")

          content = content.replace(placeholder, value)
          path.write_text(content, encoding="utf-8")
          PY

      - name: Upload frontend files to S3
        run: aws s3 sync ./frontend s3://$FRONTEND_BUCKET/frontend --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$FRONTEND_CF_DISTRIBUTION_ID" \
            --paths "/frontend/*"